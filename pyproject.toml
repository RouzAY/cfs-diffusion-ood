[project]
name = "cfs-diffusion"
version = "0.1.0"
description = "Canonical Feature Snapshots for backbone-equated diffusion out-of-distribution detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Alexis Rouzoumka" }
]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/your-username/cfs-diffusion"
Repository = "https://github.com/your-username/cfs-diffusion"

[tool.setuptools]
packages = ["cfs", "cfs.adapters", "cfs.datasets", "cfs.methods", "cfs.utils"]